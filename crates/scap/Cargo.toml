[package]
name = "glimpse_scap"
description = "Cross-platform screen capture. Forked from scap."
version = "0.1.0"
edition.workspace = true
license = "MIT"
authors = [
	"Siddharth <siddharth99c@gmail.com>",
	"Pranav <pranav2000joglekar@gmail.com>",
]

[dependencies]
futures.workspace = true
sysinfo.workspace = true
thiserror.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
windows-capture = "1.5.0"
windows.workspace = true
cpal = "0.15.2"

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics-helmer-fork = "0.24.0"
cocoa = "0.25.0"
objc = "0.2.7"
cidre = { version = "0.10.1", default-features = false, features = [
	"async",
	"av",
	"sc",
	"dispatch",
	"macos_13_0",
] }

[target.'cfg(target_os = "linux")'.dependencies]
pipewire = "0.8.0"
dbus = "0.9.7"
rand = "0.8.5"
