[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
# Local crates
glimpse_core = { path = "crates/core" }
glimpse_scap = { path = "crates/scap" }
glimpse_obs_hook = { path = "crates/obs-hook" }

# Shared
thiserror = "2"
tracing = "0.1"
futures = "0.3"

# Serialization
serde = { version = "1", features = ["derive"] }
toml = "1.1.2"

# HTTP / Archive
ureq = "3"
zip = { version = "4", default-features = false, features = ["deflate"] }

# System
sysinfo = "0.30"

# Windows
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Memory",
    "Win32_System_Performance",
    "Win32_System_Pipes",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
] }
